# ============================================================
# AutoOps — prebuilt images from ECR, running on one EC2 host, RDS for MySQL.
#
#   cd ~/autoops/deploy/aws-ec2
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Nothing is built here — images come from ECR (see README steps). Differences
# from the root docker-compose.yml, which is a laptop stack:
#   - no mysql container    — RDS provides it (prod profiles force TLS to it)
#   - no published ports    — only Caddy binds 80/443; the services are not
#                             reachable from outside the host at all
#   - SPRING_PROFILES_ACTIVE=prod everywhere, so each service's ProdSafetyGuard
#     refuses to boot on a dev default
#   - restart: unless-stopped, so the stack survives an instance reboot
#   - mem_limit on every service — the JVMs use MaxRAMPercentage=75, which
#     without a limit is 75% of the WHOLE HOST each, and they OOM-kill the box
#   - log rotation, so json-file logs cannot fill the root volume
# ============================================================
name: autoops

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  autoops:
    driver: bridge
    ipam:
      config:
        # Pinned so TRUSTED_PROXIES below can name it. auth-service ignores
        # X-Forwarded-For unless the immediate peer is a trusted proxy — without
        # this every user shares one rate-limit bucket (the gateway's IP), so
        # ten failed logins anywhere lock out everyone.
        - subnet: 172.28.0.0/16

services:
  # ---------- edge: TLS termination ----------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env, e.g. 13-53-1-2.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # holds the Let's Encrypt cert+key — do not wipe
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    mem_limit: 128m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    mem_limit: 192m

  # ---------- identity ----------
  auth-service:
    image: ${ECR_REGISTRY:?}/autoops/auth-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?RDS endpoint}
      DB_PORT: "3306"
      DB_NAME: autoops_auth
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOST: redis
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      # Persistent RS256 signing key. Without it every restart invalidates all
      # tokens; the prod guard refuses to start when it is missing.
      JWT_KEYSTORE_PATH: /secrets/jwt-keystore.p12
      JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:?}
      JWT_KEYSTORE_ALIAS: autoops-auth
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:?}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:?}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:?}
      SENDGRID_OTP_TEMPLATE_ID: ${SENDGRID_OTP_TEMPLATE_ID:-REPLACE_ME}
      # MUST stay false. The prod profile defaults it to true, which rejects
      # every request without an X-Tenant-ID header — including login, register
      # AND /actuator/health. The browser never sends that header, and a failing
      # health check stops every dependent service from starting.
      TENANT_REQUIRE_HEADER: "false"
      TRUSTED_PROXIES: 172.28.0.0/16
      CORS_ALLOWED_ORIGINS: ${SITE_URL:?}
      SSO_REDIRECT_BASE: ${SITE_URL}
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 45s
    mem_limit: 640m

  # ---------- billing / entitlements ----------
  subscription-service:
    image: ${ECR_REGISTRY:?}/autoops/subscription-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?}
      DB_PORT: "3306"
      DB_NAME: autoops_subscription
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      REDIS_HOST: redis
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_INTERNAL_TOKEN: ${SUBSCRIPTION_INTERNAL_TOKEN:?}
      PAYMENT_STUB_FAILS: "false"
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 45s
    mem_limit: 640m

  # ---------- step execution runtime ----------
  # Runs tenant-authored code (shell, python, terraform, kubectl, ssh, Lambda).
  # No published port and no gateway route: the internal token is the only thing
  # in front of it. init:true reaps orphaned grandchildren of timed-out steps.
  job-service:
    image: ${ECR_REGISTRY:?}/autoops/job-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8084/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s
    # Concurrency is already capped at 8 by the step-user pool; these keep one
    # runaway step from taking the host with it.
    mem_limit: 1g
    pids_limit: 512

  # ---------- projects / workflows / runs ----------
  core-service:
    image: ${ECR_REGISTRY:?}/autoops/core-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?}
      DB_PORT: "3306"
      DB_NAME: autoops_core
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      SUBSCRIPTION_INTERNAL_TOKEN: ${SUBSCRIPTION_INTERNAL_TOKEN:?}
      ENTITLEMENT_FAIL_OPEN: "false"
      # Real execution. Set to "simulated" to run the UI without job-service.
      EXECUTION_MODE: remote
      JOB_SERVICE_URL: http://job-service:8084
      JOB_INTERNAL_TOKEN: ${JOB_INTERNAL_TOKEN:?}
      # AES-GCM key for stored cloud credentials. Changing it makes every
      # already-saved integration undecryptable — set once, then never touch.
      CLOUD_CRED_KEY: ${CLOUD_CRED_KEY:?}
      # Outbound calls to its three peers. core-service owns runs, approvals and
      # audit; definitions live in workflow-service, agents in agent-service,
      # and lifecycle notifications are posted to plugin-service.
      #
      # No depends_on for any of them, on purpose: workflow and agent call back
      # into core-service (a hard ordering would deadlock), and notification
      # delivery is best-effort and must not gate the run engine.
      WORKFLOW_SERVICE_URL: http://workflow-service:8086
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?}
      AGENT_SERVICE_URL: http://agent-service:8087
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?}
      PLUGIN_SERVICE_URL: http://plugin-service:8088
      PLUGIN_INTERNAL_TOKEN: ${PLUGIN_INTERNAL_TOKEN:?}
      # Shared secret core-service requires on its OWN /internal/** — this is
      # what workflow-service and agent-service must present when calling back.
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:?}
    depends_on:
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 45s
    mem_limit: 768m

  # ---------- workflow definitions ----------
  # Owns the canvas and its plan limits (autoops_workflow); runs, approvals and
  # audit stay in core-service and are reached over /internal.
  #
  # Deliberately NOT depends_on core-service — the two call each other, so a
  # hard ordering deadlocks the stack on boot. Each degrades gracefully while
  # the other comes up. Same reasoning as the root docker-compose.yml.
  workflow-service:
    image: ${ECR_REGISTRY:?}/autoops/workflow-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?}
      DB_PORT: "3306"
      DB_NAME: autoops_workflow
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      ENTITLEMENT_FAIL_OPEN: "false"
      CORE_SERVICE_URL: http://core-service:8083
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:?}
      AGENT_SERVICE_URL: http://agent-service:8087
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?}
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?}
    depends_on:
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8086/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 45s
    mem_limit: 576m

  # ---------- AI agents ----------
  # Runs the native agent loop (autoops_agent). It parks on core-service's
  # approvals inbox and attaches to the run that approving it starts, so it
  # holds long-lived work — give it more headroom than workflow-service.
  agent-service:
    image: ${ECR_REGISTRY:?}/autoops/agent-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?}
      DB_PORT: "3306"
      DB_NAME: autoops_agent
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      ENTITLEMENT_FAIL_OPEN: "false"
      CORE_SERVICE_URL: http://core-service:8083
      CORE_INTERNAL_TOKEN: ${CORE_INTERNAL_TOKEN:?}
      WORKFLOW_SERVICE_URL: http://workflow-service:8086
      WORKFLOW_INTERNAL_TOKEN: ${WORKFLOW_INTERNAL_TOKEN:?}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?}
    depends_on:
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8087/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 45s
    mem_limit: 640m

  # ---------- outbound notifications ----------
  # Slack/Teams/Outlook/Gmail/GitHub channels and the rules binding lifecycle
  # events to them (autoops_plugin). core-service posts events to
  # /internal/events and delivery happens on this service's own worker pool, so
  # a slow third party never holds up a run.
  #
  # Deliberately NOT a depends_on of core-service: notification delivery is
  # best-effort and must never gate the run engine.
  plugin-service:
    image: ${ECR_REGISTRY:?}/autoops/plugin-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: ${DB_HOST:?}
      DB_PORT: "3306"
      DB_NAME: autoops_plugin
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      # Encryption at rest for webhook URLs, API tokens and SMTP passwords.
      # Separate from CLOUD_CRED_KEY on purpose — one leaked key must not open
      # both vaults. Like CLOUD_CRED_KEY, changing it strands existing rows.
      PLUGIN_CRED_KEY: ${PLUGIN_CRED_KEY:?}
      PLUGIN_INTERNAL_TOKEN: ${PLUGIN_INTERNAL_TOKEN:?}
      # Builds the "Open in AutoOps" deep link inside a notification, so it must
      # be the public site URL rather than an internal container address.
      CONSOLE_BASE_URL: ${SITE_URL:?}
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8088/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 45s
    mem_limit: 512m

  # ---------- landing-page voice agent ----------
  # Degrades to "no button" if the ElevenLabs vars are absent; nothing else
  # breaks. Its endpoints are anonymous, so its own rate limit is what protects
  # your ElevenLabs credits — the prod profile refuses to start without it.
  voice-agent:
    image: ${ECR_REGISTRY:?}/autoops/voice-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-REPLACE_ME}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-REPLACE_ME}
      VOICE_AGENT_NAME: ${VOICE_AGENT_NAME:-Aegis-01}
      VOICE_RATE_LIMIT: "true"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8085/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s
    mem_limit: 448m

  # ---------- edge routing + token validation ----------
  api-gateway:
    image: ${ECR_REGISTRY:?}/autoops/api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    environment:
      SPRING_PROFILES_ACTIVE: prod
      AUTH_SERVICE_URL: http://auth-service:8081
      SUBSCRIPTION_SERVICE_URL: http://subscription-service:8082
      CORE_SERVICE_URL: http://core-service:8083
      VOICE_SERVICE_URL: http://voice-agent:8085
      # Without these three the gateway falls back to the localhost defaults in
      # its application.yml and every /api/workflows, /api/agents,
      # /api/agent-runs, /api/plugins and /api/notification-rules request dies
      # inside the gateway container. The routes exist either way, so the
      # failure looks like a broken feature rather than a missing service.
      WORKFLOW_SERVICE_URL: http://workflow-service:8086
      AGENT_SERVICE_URL: http://agent-service:8087
      PLUGIN_SERVICE_URL: http://plugin-service:8088
      AUTH_JWKS_URI: http://auth-service:8081/oauth2/jwks
      # Must not contain localhost — the gateway's prod guard rejects it.
      CORS_ALLOWED_ORIGINS: ${SITE_URL:?}
    depends_on:
      auth-service:
        condition: service_healthy
      subscription-service:
        condition: service_healthy
      core-service:
        condition: service_healthy
      voice-agent:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
      plugin-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      retries: 12
      start_period: 30s
    mem_limit: 640m

  # ---------- SPA ----------
  # nginx serves the build and proxies /api + /oauth2 to the gateway, so the
  # browser only ever talks to one origin and no CORS is involved. The bundle
  # calls a relative /api, so the same image works on any hostname.
  frontend:
    image: ${ECR_REGISTRY:?}/autoops/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [autoops]
    depends_on:
      api-gateway:
        condition: service_healthy
    mem_limit: 128m

volumes:
  caddy-data:
  caddy-config: