# Bootstraps the API token rundeck-service authenticates to the engine with,
# so `docker compose up` produces a stack that can actually run a job without a
# human clicking through Rundeck's UI to mint one.
#
# Format: <rundeck-username>: <token>[,<role>,<role>...]
#
# The ROLES are not optional. A token with none authenticates fine and is then
# denied by Rundeck's default ACL on the first real action — which surfaces as
# "Not authorized for action" and reads like a bad token rather than a missing
# grant. `admin` is what the stock policy binds project creation to.
#
# ‼️ THIS IS A DEVELOPMENT DEFAULT, exactly like dev-internal-token.
# The token below is admin-level on the engine that executes every tenant's
# jobs. Anywhere that is not a laptop:
#
#   1. put a real value in ./.env         RUNDECK_API_TOKEN=<48+ random chars>
#   2. put the SAME value here, or mount your own file over this one
#
# ProdSafetyGuard in rundeck-service refuses to start with the default, so a
# prod deployment cannot silently keep it.
admin: autoops-platform-token,admin,user
