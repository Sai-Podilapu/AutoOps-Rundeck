server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: subscription-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:autoops_subscription}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:autoops}
    password: ${DB_PASSWORD:autoops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

autoops:
  subscription:
    jwks-uri: ${AUTH_JWKS_URI:http://localhost:8081/oauth2/jwks}
    issuer: ${JWT_ISSUER:autoops-auth-service}
    billing-period: ${BILLING_PERIOD:30d}
    entitlement-cache-ttl: ${ENTITLEMENT_CACHE_TTL:60s}
    # Payment seam: "stub" auto-succeeds (set payment-stub-fails=true to
    # exercise the PAST_DUE/retry path); "stripe" once that provider lands.
    payment-provider: ${PAYMENT_PROVIDER:stub}
    payment-stub-fails: ${PAYMENT_STUB_FAILS:false}
    # Shared secret for /internal/** (core-service scheduler checks).
    internal-token: ${SUBSCRIPTION_INTERNAL_TOKEN:dev-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
