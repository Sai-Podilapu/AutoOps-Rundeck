# ============================================================================
# CD — build every service into a container image, push to a PRIVATE ECR
# registry, then tell the EC2 host to pull and restart.
#
# THE SOURCE CODE NEVER REACHES THE SERVER. This is the whole point of the
# design: the EC2 host has no git remote, no clone, no checkout and no build
# toolchain. All it ever receives is
#   - docker-compose.prod.yml + Caddyfile   (config, synced from a private S3 bucket)
#   - container images                      (pulled from private ECR)
# Anyone who gets shell on that box finds compiled jars, not your source.
#
# There are also no AWS access keys stored in GitHub. Auth is OIDC: GitHub
# presents a short-lived signed token, AWS trades it for ~1h credentials scoped
# to this repo. Nothing long-lived exists to leak.
# ============================================================================
name: CD

on:
  push:
    branches: [main]
  # Lets you redeploy a known-good commit from the Actions tab without pushing
  # an empty commit to force it.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to redeploy (blank = build this commit)'
        required: false
        type: string

# Never let two deploys race onto the same host. cancel-in-progress is
# deliberately FALSE — killing a deploy midway leaves the stack half-upgraded,
# so a queued run waits for the current one to finish instead.
concurrency:
  group: cd-production
  cancel-in-progress: false

permissions:
  contents: read
  # Required for OIDC. Without this the role assumption fails with a confusing
  # "Not authorized to perform sts:AssumeRoleWithWebIdentity".
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_NAMESPACE: autoops

jobs:
  # --------------------------------------------------------------------------
  # Build all ten images in parallel and push them tagged with the commit SHA.
  # SHA tags mean a deploy is immutable and reproducible — "latest" moves, but
  # "sha-a1b2c3d" is forever that exact build, which is what makes rollback a
  # one-line change instead of a rebuild.
  # --------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Skip the whole build stage when redeploying an already-built tag.
    if: ${{ !inputs.image_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: agent-service
            context: backend/agent-service
          - service: api-gateway
            context: backend/api-gateway
          - service: auth-service
            context: backend/auth-service
          - service: core-service
            context: backend/core-service
          - service: job-service
            context: backend/job-service
          - service: plugin-service
            context: backend/plugin-service
          - service: subscription-service
            context: backend/subscription-service
          - service: voice-agent
            context: backend/voice-agent
          - service: workflow-service
            context: backend/workflow-service
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_NAMESPACE }}/${{ matrix.service }}:latest
          # Layer cache in GitHub's own store. Without this every run re-downloads
          # the full Maven dependency tree for all nine JVM services, which is the
          # single slowest thing in this pipeline.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: false

  # --------------------------------------------------------------------------
  # Ship config, then tell the host to pull. Uses SSM Run Command rather than
  # SSH on purpose:
  #   - no private key sits in GitHub secrets
  #   - port 22 stays closed to the internet; the agent dials out
  #   - every command issued is recorded in CloudTrail with the caller identity
  # --------------------------------------------------------------------------
  deploy:
    name: deploy to production
    runs-on: ubuntu-latest
    needs: [build]
    # `always()` so a manual redeploy (which skips `build`) is not blocked by
    # the skipped dependency, but still stop if the build genuinely failed.
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    environment:
      # Attach a GitHub Environment with a required reviewer to make production
      # deploys gated on human approval. Configure under Settings > Environments.
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ inputs.image_tag || format('sha-{0}', github.sha) }}" >> "$GITHUB_OUTPUT"

      # Only the two config files go to S3 — not the repo. The host pulls these
      # and nothing else, so compose/Caddy changes ship without a checkout.
      - name: Publish deploy config to S3
        run: |
          aws s3 cp deploy/aws-ec2/docker-compose.prod.yml \
            "s3://${{ secrets.DEPLOY_BUCKET }}/deploy/docker-compose.prod.yml"
          aws s3 cp deploy/aws-ec2/Caddyfile \
            "s3://${{ secrets.DEPLOY_BUCKET }}/deploy/Caddyfile"

      - name: Roll out on the host
        id: ssm
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          BUCKET: ${{ secrets.DEPLOY_BUCKET }}
          REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail

          # Built as a here-doc into a JSON file so the remote script can use
          # quotes and $VARs freely without fighting shell-in-YAML escaping.
          cat > /tmp/params.json <<EOF
          {
            "commands": [
              "set -euo pipefail",
              "cd /opt/autoops",
              "aws s3 sync s3://${BUCKET}/deploy/ /opt/autoops/ --exact-timestamps",
              "aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin \$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${REGION}.amazonaws.com",
              "export IMAGE_TAG=${IMAGE_TAG}",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              "docker image prune -f --filter until=168h"
            ],
            "executionTimeout": ["1800"]
          }
          EOF

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters file:///tmp/params.json \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $CMD_ID"

          # `aws ssm wait command-executed` gives up after ~100s, which is well
          # short of ten image pulls on a t3 instance. Poll manually instead.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "Deploy succeeded."; break ;;
              Failed|Cancelled|TimedOut) echo "Deploy ended: $STATUS"; break ;;
            esac
            sleep 10
          done

          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query StandardOutputContent --output text || true
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query StandardErrorContent --output text || true

          # The polling loop above deliberately does not exit on failure, so that
          # the logs always get printed. Fail the job here instead.
          [ "$STATUS" = "Success" ] || exit 1

      # Proves the rollout actually serves traffic. Without this the job is green
      # whenever `docker compose up` returns 0 — which it does even if every
      # container then crash-loops on a bad env var.
      #
      # GET /api/plans is the right probe: it is one of the few permitAll routes
      # (SecurityConfig line 59), and serving it exercises the entire chain —
      # Caddy TLS, the SPA's nginx, the gateway's routing table, subscription-
      # service and RDS. A 200 here means the stack is genuinely up, not merely
      # started. Anything that only hit Caddy would pass while every JVM was
      # crash-looping.
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "${{ secrets.SITE_URL }}/api/plans" || true)
            if [ "$CODE" = "200" ]; then echo "Healthy."; exit 0; fi
            echo "attempt $i: HTTP $CODE"
            sleep 10
          done
          echo "Smoke test never returned 200 after 5 minutes — check:"
          echo "  docker compose -f docker-compose.prod.yml ps"
          echo "  docker compose -f docker-compose.prod.yml logs --tail=100"
          exit 1
