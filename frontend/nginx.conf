# Serves the built SPA and proxies API traffic to the api-gateway container —
# the browser only ever talks to this origin, so no CORS is involved.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # API + OAuth flows go through the gateway (which validates tokens and
    # routes to auth/subscription/core services).
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hand-managed artwork copied straight from public/assets — logos, card
    # marks, tool icons. Unlike the bundles below, the FILENAME is stable while
    # the image behind it changes: a vendor rebrands, someone swaps in a better
    # mark. "immutable" tells the browser never to revalidate, not even on a
    # normal reload, so a swapped logo stays invisible until someone thinks to
    # hard-reload — and every returning user keeps the old one indefinitely.
    # Store it, but check the ETag each time: a 304 is cheap and never wrong.
    #
    # Regex wins over the /assets/ prefix below regardless of order.
    location ~ ^/assets/(models|alerts|Icons|cards)/ {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets never change content under the same name — the hash
    # IS the version, so a changed file arrives at a new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must always revalidate or browsers keep serving a stale
    # bundle after a redeploy (buttons wired to new code silently do nothing).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
