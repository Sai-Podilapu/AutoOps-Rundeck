# ============================================================
# AutoOps — the laptop stack, on a public URL, for client demos.
#
#   .\deploy-demo\up.ps1        # start (or restart) the demo
#   .\deploy-demo\down.ps1      # back to a localhost-only stack
#
# This is an OVERLAY on the root docker-compose.yml, not a replacement. Same
# images, same `dev` Spring profiles, same MySQL volume — so what a client sees
# is exactly what you see on http://localhost:5173, demo data and all. It adds
# one ngrok container and rewrites the handful of env vars that hardcode
# localhost.
#
# Deliberately NOT deploy/aws-ec2/docker-compose.prod.yml: that one runs prebuilt
# ECR images against RDS with SPRING_PROFILES_ACTIVE=prod, and every service's
# ProdSafetyGuard then refuses to boot on a dev default. Different app, different
# behaviour — the opposite of "works like localhost".
#
# One tunnel is enough for the whole platform: frontend/nginx.conf already
# proxies /api and /oauth2 to the gateway, so the browser only ever talks to one
# origin. Nothing else needs exposing, and no service but the frontend is
# reachable through the tunnel.
#
# Run everything from the repo root. With multiple -f files Compose resolves ALL
# relative paths against the FIRST file's directory, which is why the volume
# paths below say ./deploy-demo/... rather than ./...
# ============================================================
name: autoops

services:
  # ---------- the tunnel ----------
  # Forwards a public https:// URL straight to the SPA's nginx over the compose
  # network. Nothing is published to the host for this, and ngrok itself never
  # has to be installed on Windows.
  #
  # Pinned to the v3 line on purpose: v3 dropped the old --basic-auth and
  # --request-header-add flags in favour of traffic-policy files, so a :latest
  # that rolled to v4 would break the command line below.
  ngrok:
    image: ngrok/ngrok:3
    restart: unless-stopped
    command:
      - http
      - frontend:80
      - --url=https://${NGROK_DOMAIN:?set NGROK_DOMAIN in deploy-demo/.env.demo — see the README}
      # Auth, IP restrictions and header rewriting all live in here now.
      - --traffic-policy-file=/etc/ngrok/traffic-policy.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in deploy-demo/.env.demo — see the README}
    volumes:
      - ./deploy-demo/traffic-policy.yml:/etc/ngrok/traffic-policy.yml:ro
    ports:
      # The agent's request inspector — every request, header and response body
      # that crossed the tunnel. Bound to loopback so it is yours alone.
      - "127.0.0.1:4040:4040"
    depends_on:
      frontend:
        condition: service_started

  # ---------- the SPA, unchanged except for one proxy header ----------
  frontend:
    volumes:
      # ngrok terminates TLS at its edge and forwards plain HTTP in here, so the
      # baked-in nginx.conf would tell every service downstream that the visitor
      # is on http. This variant keeps the edge's X-Forwarded-Proto. Bind-mounted
      # over the image's copy, so the frontend never needs rebuilding.
      - ./deploy-demo/nginx.demo.conf:/etc/nginx/conf.d/default.conf:ro

  # ---------- identity ----------
  auth-service:
    environment:
      # This service alone runs SPRING_PROFILES_ACTIVE=dev, and its
      # application-dev.yml HARDCODES the CORS origins as a literal list:
      #
      #     cors:
      #       allowed-origins:
      #         - http://localhost:5173
      #         - http://localhost:3000
      #
      # A profile YAML outranks the ${CORS_ALLOWED_ORIGINS} placeholder in
      # application.yml, so setting that env var does nothing here — the one
      # below is what actually takes effect, because an environment variable
      # outranks both. (The gateway runs no profile, which is why it honours
      # the plain CORS_ALLOWED_ORIGINS just fine.)
      #
      # This is not cosmetic. The SPA is same-origin through nginx, but browsers
      # attach an Origin header to every non-GET request even same-origin, so
      # Spring's CORS filter still evaluates it — and a rejected origin comes
      # back as 403 "Invalid CORS request". Without this line, login fails.
      AUTOOPS_AUTH_CORS_ALLOWEDORIGINS: https://${NGROK_DOMAIN},http://localhost:5173
      # Kept so the config is still right if the dev profile is ever dropped.
      CORS_ALLOWED_ORIGINS: https://${NGROK_DOMAIN},http://localhost:5173
      # This is the one that actually matters for a room full of people.
      #
      # trusted-proxies defaults to empty (application.yml), which means
      # X-Forwarded-For is never trusted and every visitor shares ONE rate-limit
      # bucket keyed by the gateway container's IP. The limits are 10 login
      # attempts and 5 OTP requests — so two clients fumbling a password locks
      # out everyone, mid-demo. Trusting the Docker private range makes the
      # limiter read the real client IP, giving each visitor their own bucket.
      #
      # It does mean anything on this bridge network could spoof the header. On a
      # laptop stack where every container is ours, that is a fine trade.
      TRUSTED_PROXIES: 172.16.0.0/12
      # Only used if you later wire up Google/Microsoft login; harmless now.
      SSO_REDIRECT_BASE: https://${NGROK_DOMAIN}

  # ---------- edge routing ----------
  api-gateway:
    environment:
      # The SPA is same-origin through nginx, so CORS never fires for it. This is
      # for anything that calls the gateway directly — Postman, a webhook test,
      # the browser console.
      CORS_ALLOWED_ORIGINS: https://${NGROK_DOMAIN},http://localhost:5173

  # ---------- deep links in outbound notifications ----------
  # Without these, an "Open in AutoOps" link in a Slack message or email points
  # at http://localhost:5173 — which resolves to the *recipient's* machine.
  core-service:
    environment:
      CONSOLE_BASE_URL: https://${NGROK_DOMAIN}

  plugin-service:
    environment:
      CONSOLE_BASE_URL: https://${NGROK_DOMAIN}
