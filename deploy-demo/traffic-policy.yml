# ngrok traffic policy for the AutoOps demo endpoint.
#
# As of ngrok v3 this file is the only way to configure auth, IP allow-lists and
# header rewriting — the old --basic-auth / --request-header-add agent flags are
# gone. Nothing is enabled right now; the demo link is deliberately open so a
# client can just click it.
#
# It does NOT try to suppress ngrok's "You are about to visit..." interstitial.
# That was tested against this endpoint: injecting the documented
# ngrok-skip-browser-warning header via an add-headers action here does not
# bypass it, because ngrok's abuse check runs ahead of the policy. A browser
# User-Agent gets the warning page; only non-browser clients skip it. On a free
# plan the visitor clicks "Visit Site" once and is then fine on that browser.
# See README.md.
#
# NOTE: ngrok validates this file SERVER-SIDE, when the agent connects. A bad
# action name does not fail at parse time — it fails the tunnel. If ngrok is
# crash-looping after you edit this, up.ps1 prints its log and points you here.

on_http_request: []

# ---- Optional: put a password in front of the whole demo ----
# The link executes shell/python/terraform steps via job-service, so it is a real
# door into this laptop. To gate it, replace the line above with:
#
# on_http_request:
#   - actions:
#       - type: basic-auth
#         config:
#           credentials:
#             - "demo:pick-a-real-password"

# ---- Optional: allow only known IPs ----
# on_http_request:
#   - actions:
#       - type: restrict-ips
#         config:
#           enforce: true
#           allow:
#             - 203.0.113.0/24     # the client's office range
